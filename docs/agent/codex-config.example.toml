# Verified with Codex CLI 0.144.1 on 2026-07-14.
# Replace the .invalid URL. OAuth credentials are created by `codex mcp login zero`.

[mcp_servers.zero]
url = "https://zero.example.invalid/mcp"
auth = "oauth"
enabled = true
enabled_tools = [
  "getServerCapabilities",
  "getConnections",
  "getActiveConnection",
  "setActiveConnection",
  "listThreads",
  "searchThreads",
  "getThread",
  "getThreadContext",
  "listDrafts",
  "getDraft",
  "createReplyDraft",
  "updateDraft",
]
default_tools_approval_mode = "writes"
