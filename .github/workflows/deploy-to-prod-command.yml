name: Deploy to Production Command

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  deploy-to-production:
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    name: Merge Staging to Production
    if: github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'production-deploy') && startsWith(github.event.comment.body, '/deploy') && github.event.comment.author_association == 'MEMBER'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy gate: the SHA about to be force-pushed to main (staging's tip) MUST
      # have a green `quality-and-security` CI run. Without this, `/deploy` could
      # ship a red commit to production. Hard stop (exit 1) if CI is not success.
      # Only trusted contexts are interpolated (github.repository); the SHA is
      # computed in-shell — no untrusted event data reaches the shell.
      - name: Require green CI on staging before deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin staging
          SHA="$(git rev-parse origin/staging)"
          echo "Deploy gate: verifying CI (quality-and-security) is green on staging@$SHA"
          CONCLUSION="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" --jq '.workflow_runs[0].conclusion // "none"')"
          echo "Latest completed CI conclusion for $SHA: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Refusing to deploy: CI on staging@$SHA is '$CONCLUSION' (must be 'success'). Force-push to main blocked."
            exit 1
          fi
          echo "CI is green on staging@$SHA — deploy may proceed."

      - name: Rebase the main branch on staging
        id: rebase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin staging
          git checkout main
          git rebase staging
          echo "rebase_status=$?" >> $GITHUB_OUTPUT

      - name: Error if rebase was not successful
        if: ${{ steps.rebase.outputs.rebase_status != 0 }}
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            Failed to rebase staging on main, please rebase manually and run the command again.

      - name: Push changes if rebase was successful
        if: ${{ steps.rebase.outputs.rebase_status == 0 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push --force-with-lease origin main
